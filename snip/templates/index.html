{% extends "base.html" %}
{% block content %}
<h1>Shorten a link</h1>
<form id="shorten-form" novalidate>
  <label for="url">Long URL</label>
  <input id="url" name="url" type="url" placeholder="https://example.com/a/very/long/address" required autofocus>

  <div class="row">
    <div>
      <label for="alias">Custom alias <span class="optional">(optional)</span></label>
      <input id="alias" name="alias" type="text" placeholder="my-link" maxlength="30">
    </div>
    <div>
      <label for="expires">Expires</label>
      <select id="expires" name="expires">
        <option value="">Never</option>
        <option value="1">In 1 day</option>
        <option value="7">In 7 days</option>
        <option value="30">In 30 days</option>
      </select>
    </div>
  </div>

  <button type="submit">Shorten</button>
  <p id="error" class="error" role="alert" hidden></p>
</form>

<section id="result" class="card" hidden>
  <p class="label">Your short link</p>
  <div class="short-row">
    <a id="short-link" href="#"></a>
    <button id="copy" type="button" class="secondary">Copy</button>
  </div>
  <a id="stats-link" href="#">View click statistics</a>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
